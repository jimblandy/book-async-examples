[package]
name = "treesitter-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
argh = "0.1"
axum = { version = "0.8.6", features = ["tokio", "http1", "json"] }
env_logger = "0.9"
http = "1.3.1"
log = "0.4"
reqwest = { version = "0.12.24", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
